apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-svc
  namespace: stagelog
  labels:
    app: notifications-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications-svc
  template:
    metadata:
      labels:
        app: notifications-svc
    spec:
      serviceAccountName: stagelog-notifications-api-sa
      containers:
      - name: notifications-svc
        image: 430118823715.dkr.ecr.ap-northeast-2.amazonaws.com/stagelog-notifications:latest
        imagePullPolicy: Always
        envFrom:
        - secretRef:
            name: stagelog-notifications-env
        env:
        - name: DJANGO_SETTINGS_MODULE
          value: config.settings
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 400m
            memory: 512Mi
        ports:
        - containerPort: 8000
