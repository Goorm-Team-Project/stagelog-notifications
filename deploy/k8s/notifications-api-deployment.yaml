apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-svc
  namespace: stagelog
  labels:
    app: notifications-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications-svc
  template:
    metadata:
      labels:
        app: notifications-svc
    spec:
      serviceAccountName: stagelog-notifications-api-sa
      containers:
      - name: notifications-svc
        image: 430118823715.dkr.ecr.ap-northeast-2.amazonaws.com/stagelog-notifications:latest
        imagePullPolicy: Always
        env:
        - name: DJANGO_SETTINGS_MODULE
          value: config.settings
        volumeMounts:
        - name: env-file
          mountPath: /app/.env
          subPath: .env
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 400m
            memory: 512Mi
        ports:
        - containerPort: 80
      volumes:
      - name: env-file
        secret:
          secretName: stagelog-notifications-env
          items:
          - key: .env
            path: .env
